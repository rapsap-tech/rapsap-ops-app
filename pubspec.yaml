name: rapsap_ops_app
description: "Rapsap Ops — store operations app (PWA, Android, iOS)."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.6
  camera: ^0.12.2
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ^3.0.0
  file_picker: ^13.3.1
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  flutter_web_plugins:
    sdk: flutter
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  injectable: ^3.0.0
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  package_info_plus: ^10.2.2
  pinput: ^6.0.1
  pretty_dio_logger: ^1.4.0
  sentry_flutter: ^10.2.0
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  video_player: ^2.14.1
  web: ^1.1.2
  web_socket_channel: ^3.0.3
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
        - asset: assets/fonts/DMSans-800.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
